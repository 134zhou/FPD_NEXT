# ============================================================================
# 多粒子集体沉降（Phase 6）
#
# 物理构型：x/y 周期、z 上下无滑移硬壁，重力只作用在粒子上。
# 粒子间势与壁面势都用 WCA（纯排斥），确保是「稳定悬浮液沉降」而不是聚集。
#
# 初始构型（离壁 >= 8，即相场不被壁面截断）：
#   python3 tools/make_init.py --grid 128 64 32 --phi 0.05 --seed 20260914 \
#           -o out/sed_init.fpd
#   标称 φ = 0.0497（解析球 4/3·πa³ 约定），N = 95
#
# ⚠️ 绝对沉降速度不能从这一个盒子推出来：a/L_z = 0.1，壁面受限 + 周期镜像
#    是 10% 量级的偏差（Phase 4 的 L 外推才解决）。本算例能做的是【同一盒子内
#    的相对比较】（不同 φ 的 U(φ)/U(φ₀)）。
# ============================================================================
Nx = 128
Ny = 64
Nz = 32
dt = 0.002
n_steps = 200000
kT = 0.25
radius = 3.2
xi = 1.0
ratio_eta = 50.0

# 边界固定为 x/y 周期、z 向上下无滑移硬壁，不是配置项。
noise_on = 1

# --- 粒子间排斥势：WCA，接触距离落在粒子表面 ---
# WCA ≡ LJ12-6 + rcut = 2^(1/6)σ（派生，不给 pot_rcut）。
# σ 取 2a/2^(1/6) = 5.7018 ⇒ rcut = 2a = 6.4，即粒子表面接触处力为 0。
# ε = 10 ≈ 40·kT，足够硬，重叠不会发生。
potential = wca
pot_sigma = 5.7018
pot_eps = 10.0

# --- 粒子-壁面排斥势：WCA，自变量是【表面间隙】h = (z±1/2) - a ---
# σ = 2 时 rcut = 2.24492。gravity_z = -10 对应历史独立计算的平衡位置：
#   h_rest ≈ 2.0189 → 粒子中心停在 z_rest ≈ 4.7189（离下壁 5.22）
# 该高度上相场截断只有 0.5% 量级（W4 实测 Rz=4.0 时 sum_phiz/sum_phix = 0.995309）。
wallpotential = wca
wall_sigma = 2.0
wall_eps = 1.0

gravity_z = -10

init_file = out/sed_init.fpd
out_dir = out
run_name = sed
interval_ckpt = 5000
interval_log = 10000
save_pressure = 1
seed = 20260914
