# ============================================================================
# 多粒子集体沉降（Phase 6）
#
# 物理构型：x/y 周期、z 上下无滑移硬壁。重力是【体力 rho*g】，净体密度
# (rho - rho_l)*g；粒子受到的净重力自动是 (rho_p - rho_l) * int(phi) * g。
# 粒子间势与壁面势都用 WCA（纯排斥），确保是「稳定悬浮液沉降」而不是聚集。
#
# 初始构型（离壁 >= 8，即相场不被壁面截断）：
#   python3 tools/make_init.py（仓库默认数据块）
#   标称 φ = 0.0497（解析球 4/3·πa³ 约定），N = 95
#
# ⚠️ 绝对沉降速度不能从这一个盒子推出来：a/L_z = 0.1，壁面受限 + 周期镜像
#    是 10% 量级的偏差（Phase 4 的 L 外推才解决）。本算例能做的是【同一盒子内
#    的相对比较】（不同 φ 的 U(φ)/U(φ₀)）。
# ============================================================================
dt = 0.002
n_steps = 200000
kT = 0.25
radius = 3.2
xi = 1.0
ratio_eta = 50.0
# 粒子/溶剂质量密度比。=1 即论文的等密度假设（此时重力净效果为 0）。
ratio_rho = 2.0

# 边界固定为 x/y 周期、z 向上下无滑移硬壁，不是配置项。
noise_on = 1

# --- 粒子间排斥势：WCA，接触距离落在粒子表面 ---
# WCA ≡ LJ12-6 + rcut = 2^(1/6)σ（派生，不给 pot_rcut）。
# σ 取 2a/2^(1/6) = 5.7018 ⇒ rcut = 2a = 6.4，即粒子表面接触处力为 0。
# ε = 10 ≈ 40·kT，足够硬，重叠不会发生。
potential = wca
pot_sigma = 5.7018
pot_eps = 10.0

# --- 粒子-壁面排斥势：WCA，自变量是【表面间隙】h = (z±1/2) - a ---
# σ = 2 时 rcut = 2.24492。
# 历史值 gravity_z = -10 是【每粒子恒力】；现在 gravity_* 是加速度，必须按
#     g_new = F_old / ((ratio_rho - 1) * int(phi))
# 换算。int(phi) = 170.306（体相，FACE_X），ratio_rho = 2 ⇒ g = -10/170.306
# = -0.058718。贴壁时 z 向 int(phi_z) 因壁面截断小 0.47%，所以平衡点略移：
# 独立二分给出 z_rest = 4.7191（对照旧的 4.7189），力平衡残差 6e-14。
# 该高度上相场截断只有 0.5% 量级（W4 实测 Rz=4.0 时 sum_phiz/sum_phix = 0.995309）。
wallpotential = wca
wall_sigma = 2.0
wall_eps = 1.0

gravity_x = 0
gravity_y = 0
gravity_z = -0.058718

# init_file 由 tools/make_init.py 生成（当前默认输出是 512^3 的另一个构型）。
# 若 out/ 已搬走，请把 init_file 指到对应副本或重新生成 128x64x32 / N=95 的初态；
# 仓库里 init/*.fpd 是 512 网格的构型，不是本算例的盒子。
init_file = out/sed_init.fpd
out_dir = out
run_name = sed
interval_ckpt = 5000
interval_log = 10000
seed = 20260914
