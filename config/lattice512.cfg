# 512x512x64 粒子阵列：51x51x3 个粒子（N=7803），格点间距 10，z = 10, 20, 30。
# 网格尺寸和粒子数只从 init_file 读取，不在配置中重复填写。
dt = 0.002
n_steps = 200000

kT = 0.25
radius = 3.2
xi = 1.0
ratio_eta = 50.0
# 粒子/溶剂质量密度比（必填）。=1 即等密度，重力净效果为 0。
ratio_rho = 2.0

noise_on = 1
# gravity_* 是加速度，不是每粒子恒力。旧的 gravity_z=100（力）按
#     g = F_old / ((ratio_rho-1) * int(phi))
# 换算：100 / (1 * 170.306) = 0.58716（int(phi) 为体相 FACE_X 值）。
gravity_x = 0
gravity_y = 0
gravity_z = 0.58716

# 初始格点间距为 10；WCA 截断距离为 2a=6.4。
potential = wca
pot_sigma = 5.7018
pot_eps = 10.0
wallpotential = wca
wall_sigma = 2.0
wall_eps = 1.0

init_file = init/sed_init.fpd
out_dir = out/test-20260924
run_name = lattice512
interval_ckpt = 1000
interval_log = 1000
seed = 20260914
