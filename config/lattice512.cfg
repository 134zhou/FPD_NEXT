# tools/make_init.py 当前构型：512x512x64，51x51x3 个粒子（N=7803）。
# 网格尺寸和粒子数只从 init_file 读取，不在配置中重复填写。
dt = 0.002
n_steps = 200000

kT = 0.25
radius = 3.2
xi = 1.0
ratio_eta = 50.0

# 当前最低一层位于 z=0；半径为 3.2 时不能启用粒子-壁面势。
# 同时关闭噪声和外场，避免没有壁面排斥时粒子穿墙。
noise_on = 0
gravity_x = 0
gravity_y = 0
gravity_z = 0

# 初始格点间距为 10；WCA 截断距离为 2a=6.4。
potential = wca
pot_sigma = 5.7018
pot_eps = 10.0
wallpotential = none

init_file = init/sed_init.fpd
out_dir = out
run_name = lattice512
interval_ckpt = 5000
interval_log = 1000
seed = 20260914
